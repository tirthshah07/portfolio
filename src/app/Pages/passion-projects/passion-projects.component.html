@if (passionProjects.display) {
  <section class="section" aria-label="Open-source work">
    <div class="wrap">
      <app-section-heading index="04" eyebrow="Work"
        description="Experiments and tools I have published — browse them on GitHub.">
        Side projects, <em>in the open.</em>
      </app-section-heading>

      @if (repo.length) {
        <ul class="repos">
          @for (project of repo; track $index) {
            <li appReveal="up" [revealDelay]="($index % 3) * 60">
              <app-project [repo]="project" [index]="$index + 1"></app-project>
            </li>
          }
        </ul>
      }

      <a class="gh tile" appReveal="up" [href]="socialMediaLinks.github" target="_blank" rel="noopener noreferrer">
        <div class="gh-glow" aria-hidden="true"></div>
        <div class="gh-head">
          <span class="mono-label">{{repo.length ? 'More on GitHub' : 'Browse my repositories'}}</span>
          <svg class="gh-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </div>
        <p class="gh-handle">
          <svg class="gh-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.7.3 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
          {{githubHandle}}
        </p>
      </a>
    </div>
  </section>
}
