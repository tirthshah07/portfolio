<a class="repo tile" [href]="repo?.url" target="_blank" rel="noopener noreferrer">
  <div class="repo-head">
    <span class="num">{{index | number: '2.0'}}</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
  </div>
  <h3 class="name">{{repo?.name}}</h3>
  <p class="desc">{{repo?.description || 'No description provided.'}}</p>
  <p class="meta">
    @if (repo?.primaryLanguage?.name) { <span>{{repo.primaryLanguage.name}}</span> }
    <span>★ {{repo?.stargazerCount}}</span>
  </p>
</a>
