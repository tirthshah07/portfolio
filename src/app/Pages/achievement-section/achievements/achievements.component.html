<a class="cert tile" [href]="cardInfo.footerLink[0]?.url" target="_blank" rel="noopener noreferrer">
  <span class="logo"><img [src]="cardInfo.image" [alt]="cardInfo.imageAlt" loading="lazy"></span>
  <span class="text">
    <span class="title">{{cardInfo.title}}</span>
    <span class="sub">{{cardInfo.subtitle || cardInfo.imageAlt}}</span>
  </span>
  <span class="go" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
  </span>
  <span class="sr-only">{{cardInfo.footerLink[0]?.name}}</span>
</a>
