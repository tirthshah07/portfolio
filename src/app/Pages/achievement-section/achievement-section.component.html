@if (achievementSection.display) {
  <section class="section" aria-label="Certifications">
    <div class="wrap">
      <app-section-heading index="05" eyebrow="Certificates"
        description="Courses and programmes I've completed along the way.">
        Certified, and still <em>learning.</em>
      </app-section-heading>

      <ul class="certs">
        @for (achievement of achievementSection.achievementsCards; track $index; let i = $index) {
          <li appReveal="up" [revealDelay]="(i % 2) * 70">
            <app-achievements [cardInfo]="achievement" [index]="i + 1"></app-achievements>
          </li>
        }
      </ul>
    </div>
  </section>
}
