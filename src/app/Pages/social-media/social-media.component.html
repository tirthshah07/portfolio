@if (socialMediaLinks.display) {
  <div class="socials">
    @if (socialMediaLinks.github.trim() != '') {
      <a [href]="socialMediaLinks.github" class="social" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    }
    @if (socialMediaLinks.linkedin.trim() != '') {
      <a [href]="socialMediaLinks.linkedin" class="social" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
    }
    @if (socialMediaLinks.gmail.trim() != '') {
      <a [href]="'mailto:' + socialMediaLinks.gmail" class="social" aria-label="Email">
        <i class="fa-solid fa-envelope"></i>
      </a>
    }
  </div>
}
